
name: Build EDGE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'EDGE-Sharp-Entry-Android-V2-source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p edge-src
          unzip -q EDGE-Sharp-Entry-Android-V2-source.zip -d edge-src

      - name: Build APK
        run: gradle -p edge-src assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EDGE-Sharp-Entry-debug-apk
          path: edge-src/app/build/outputs/apk/debug/*.apk
